name: Publish ExamStudio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Extract the recovered site
        id: extract
        run: |
          mkdir -p site
          unzip -q examstudio-source.zip -d site
          INDEX_FILE="$(find site -type f -path '*/dist/index.html' -print -quit)"
          test -n "$INDEX_FILE"
          echo "dist_dir=${INDEX_FILE%/index.html}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.extract.outputs.dist_dir }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
